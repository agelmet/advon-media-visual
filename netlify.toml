# Netlify configuration for advonmedia.com (Next.js via the Netlify Next runtime).
# Build settings stay as configured in the Netlify UI; this file only adds
# long-lived caching for the self-hosted image assets. Security headers (CSP,
# HSTS, XFO, …) are set in next.config.ts so they apply to every route,
# including server-rendered ones.

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Client chat pages — advonmedia.com/c/<code> is one static page (public/c/index.html) that reads the
# code from the URL. Served straight from the CDN, no function involved.
[[redirects]]
  from = "/c/*"
  to = "/c/index.html"
  status = 200

# Skip the build (15 credits each) when a push only touches notes/docs.
[build]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)*.md' ':(exclude)Claude outputs'"
